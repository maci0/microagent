# microagent configuration: the provider settings, the system prompt addendum,
# the repository instructions, the skills, the MCP servers, the command filter,
# the sandbox and the tool set.
# Copy to ~/.microagent/config.toml, or point MICROAGENT_CONFIG or --config at
# it. Every key is optional. A missing key, a bad value or a missing file keeps
# the built-in default, and the first line this file gets wrong is named on
# stderr. The run stops instead on a [tools.<name>] table it cannot honor, a
# model outside models, a reasoning_effort that names no level, and a base_url
# or api_key it refuses. A flag beats its environment variable, which beats
# this file.
#
# A list may span lines, one element per line, each with an optional trailing
# `#` comment. A list left without its closing bracket is refused by name, and
# the tables under it still apply.

# Where the run talks and with what key.
#
# model has a default; base_url and api_key have none, and a run that names
# neither is refused before the first request. There is no default provider.
#
# api_key is a secret written in the clear, and the `read` tool can open this
# file: keep it mode 600, out of any workspace the model is given, or leave the
# key to MICROAGENT_API_KEY or --api-key instead. A file naming one and readable
# by any account beyond its owner is said on stderr by name; the run goes on.
#
# model    = "deepseek/deepseek-v4-flash"
# base_url = "https://api.openai.com/v1"
# api_key  = "sk-..."
# OpenCode Zen: base_url = "https://opencode.ai/zen/v1"
# OpenCode Go:  base_url = "https://opencode.ai/zen/go/v1"
# Use your OpenCode API key and a Chat Completions model ID, e.g. "kimi-k2.6",
# without "opencode/" or "opencode-go/". See docs/usage.md#opencode-zen-and-go.

# The models an ACP client may switch a session among, all on base_url. model
# is the default and must be one of them; with no model the first is. A
# --model or MICROAGENT_MODEL outside the list joins its front.
# models = ["deepseek/deepseek-v4-flash", "kimi-k2.6"]
# Add the provider's own GET <base_url>/models list to the ACP selector, asked
# once at the first session; a failure keeps the list above.
# discover_models = true

# Optional reasoning level for models that support it: minimal, low, medium,
# high, or none to disable. Leave unset to use the provider's default.
# reasoning_effort = "high"

# Extra headers on every provider request, file only. A header the client sets
# itself (Authorization, User-Agent, Content-Type, Accept, ...) refuses the table.
# headers = { "x-grok-client-version" = "1.0.77" }

# Text appended to the system prompt after a blank line, at most 16 KB. A basic
# string ("..." with the escapes \b \t \n \f \r \" \\ \uXXXX \UXXXXXXXX), a
# literal string ('...') in which nothing is an escape, or
# either kind over several lines ("""...""" or '''...''').
#
# system_prompt_extra = "Answer in at most three sentences."
#
# The default below is terse prose (caveman ultra) and minimal code (ponytail
# full). `system_prompt_extra = ""` sends the stock prompt.
system_prompt_extra = '''
Maximum compression. Drop articles, filler, pleasantries, hedging, and conjunctions whose
meaning survives without them. One word where one word is enough. Fragments are fine.
State each fact once. No preamble, no restating the request, no closing summary, no
tool-call narration, no decorative tables or emoji.
Technical terms, code, commands, file paths and exact error strings are never compressed.
Never drop not, never, no, only or except when that flips the meaning, and never drop a
required code or step to save words.
Security warnings and irreversible-action confirmations are written in complete, plain English.
Code, commit messages, docs and anything else written for other people stay normal prose.

Prefer the laziest correct change. Settle first whether the change needs to exist at all; if
it does not, say so in one line. Reuse a helper, type or pattern the repository already has
before writing a new one. Use the standard library and native platform features before
adding code or a dependency. One line beats fifty. Fix the root cause, not the symptom:
grep every caller of the function you are about to touch. No unrequested abstractions, no
scaffolding for later, deletion over addition. Mark a deliberate shortcut that has a real
ceiling with a comment naming that ceiling and the upgrade path.
Never simplify away input validation at a trust boundary, error handling that prevents data
loss, security measures, accessibility, or anything the task explicitly asks for. Leave one
runnable check behind for non-trivial logic.
'''

# The repository's own instructions, read from the working directory when the
# run starts and appended to the system prompt. With the key absent the run
# reads `AGENTS.md`, the name other coding agents read; `agents_files = []`
# turns the read off, and a list names other paths, in order. This is
# repository content the run follows as instructions, so `[]` is how the
# operator declines it. A file past 128 KB is followed up to the cap. A listed
# path that is missing is named on stderr; a missing default is silent.
# agents_files = ["AGENTS.md"]

# Where skills are read from: one directory per root, each holding one
# directory per skill, each with a SKILL.md in it. A relative path is resolved
# against the working directory. Leaving the key out uses
# $HOME/.microagent/skills; `skills = []` turns skills off. MICROAGENT_SKILLS
# overrides this key for one run. The working directory is never a default
# root: a SKILL.md in a repository under review was written by whoever wrote
# that repository, and a skill body is instructions the model follows. Name a
# directory here, or in MICROAGENT_SKILLS, to say its bytes are instructions.
#
# skills = ["./skills", "~/.microagent/skills"]

# One table per MCP server. `name` and one of `command` or `url` are required. A
# `command` server is started over stdio before the first request; `args` is a
# list of strings and `env` is an inline table. Its tools are offered to the
# model as mcp__<server>__<tool>. A server that cannot start, be reached or
# answer is reported on stderr and skipped. An `env` key is a variable name:
# letters, digits and underscores, quoted or not. A key outside that form, or a
# value holding a NUL, is one the child's environment cannot hold, so that
# server is skipped rather than spawned.
#
# An `env` value is the second place in this file a secret can be written in the
# clear, after `api_key`, and the easier one to commit by accident. Where a
# server can inherit a variable, set it in the run's environment instead. A
# terminal run scrubs the provider key, GITHUB_TOKEN and configured remote-key
# variables from that environment (`microagent acp` does not; see
# docs/usage.md#tool-environment), so a stdio server needing one must receive it
# through `env`. Keep this file mode 600 and out of the model's workspace when
# it holds secrets.
#
# [[mcp]]
# name = "fs"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
# env = { LOG = "debug" }
#
# [[mcp]]
# name = "git"
# command = "mcp-server-git"
# args = ["--repository", "."]
# env = { GITHUB_TOKEN = "ghp_..." }   # a secret in the clear, see above
#
# A `url` server is a remote streamable-HTTP endpoint instead of a process. The
# url is https, or http to this machine. Every key after it is optional:
# api_key_env is the NAME of an environment variable that holds the key, never
# the key itself; api_key_header is where the key goes (default Authorization,
# sent as "Bearer <key>"; any other header gets the key as it is); timeout is
# seconds per request, 1 to 600, default 30. A variable that is unset or empty
# sends no header, and the server is named on stderr. A terminal run removes
# the variable from the environment tool subprocesses inherit.
#
# [[mcp]]
# name = "docs"
# url = "https://mcp.example.com/mcp"
# api_key_env = "DOCS_MCP_KEY"
# api_key_header = "Authorization"
# timeout = 30

# The tool set. `[tools.<name>]` takes `enabled` (true or false). The built-ins
# (bash, read, write, edit, multi_edit, search, ast, git, todo) are on by
# default; `enabled = false` removes one from the schema the model sees and
# refuses its calls. At least one must stay on. A name that is not a tool stops
# the run with exit status 2, so a misspelling cannot leave a tool as it was.
#
# [tools.ast]
# enabled = false
# [tools.git]
# enabled = false

# Four public remote MCP servers, off until a table below says `enabled = true`:
# a call to one carries the query the model built out of your task. A keyless
# preset on its own host is offered from tools and schemas in the binary and
# connects on first use; one with a resolved api_key_env, or a url on another
# host, connects at startup (docs/usage.md#tool-set). An unreachable server is
# named on stderr. Tools are offered as mcp__<name>__<tool>
# (mcp__context7__query-docs, mcp__grep_app__searchGitHub, ...). None needs a
# key today. Each takes the same optional keys as a `url` server above: url
# (another endpoint), api_key_env, api_key_header and timeout.
#
# Web search and page fetch (https://mcp.exa.ai/mcp).
# [tools.web_search]
# enabled = true
# timeout = 30
# api_key_env = "EXA_API_KEY"   # only for a plan that has a key
#
# Library documentation (https://mcp.context7.com/mcp).
# [tools.context7]
# enabled = true
#
# Code search over public GitHub repositories (https://mcp.grep.app).
# [tools.grep_app]
# enabled = true
# url = "https://mcp.grep.app"
#
# Documentation and questions about a GitHub repository (https://mcp.deepwiki.com/mcp).
# [tools.deepwiki]
# enabled = true

# Denied shell commands for the `bash` tool. Any command containing one of these
# command names or sequences (e.g. `sudo`, `/usr/bin/sudo`, `rm -rf`) is refused
# before execution. A top-level list of strings.
#
# deny_commands = ["sudo", "su", "shutdown", "reboot"]

# Workspace sandbox. When enabled, file writes are confined to the working
# directory, /tmp, the session directory, $TMPDIR where it names an absolute
# directory none of those covers, and each `writable` entry. Landlock on Linux
# (kernel 5.13+) and a Seatbelt profile on macOS confine microagent and every
# child it spawns (bash, MCP servers); write, edit, multi_edit and an ast
# rewrite also check their path in process. `writable` without `enabled = true`
# confines nothing, and the run says so on stderr. In an entry a leading `~` or
# `~/` is the home directory and a relative path resolves against the working
# directory, so "build" names the working directory's build.
#
# [sandbox]
# enabled = true
# writable = [".", "/tmp"]
