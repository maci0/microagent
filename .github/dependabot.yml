# Every action in the workflows and the composite toolchain action is pinned to a
# commit sha, so a new upstream release cannot turn a green run red on its own.
# The cost of that is a pin nothing moves: a sha stops naming a supported
# runner, or an action a workflow needs, and the pipeline only finds out on a
# push. Dependabot opens the bump, which is a diff of the sha and the version
# comment beside it, reviewed and gated like any other change.
#
# Only the actions ecosystem is declared. The linter pins in
# lint-requirements.txt are deliberately not: `make lint-versions` refuses a
# bump to that file that forgets the version named in the Makefile, so a bot
# opening that pull request would produce a red pipeline by construction. That
# pair moves by hand, as one change, and `make lint-versions` is what says so.
#
# The Harbor adapter's set is left out for the same reason, and it is worth
# saying so here rather than leaving it to be rediscovered: `harbor==0.23.0` in
# integrations/harbor/requirements.txt resolves to ninety packages in
# requirements.lock, every artifact hashed, and dependabot's pip ecosystem
# updates requirements.txt without regenerating that uv lock. `make lint-lock`
# then refuses the tree, because the lock no longer carries the pin the
# manifest names, so the pull request is red until somebody runs the
# `uv pip compile` recorded at the top of the manifest by hand. Ninety
# transitive packages with no automated bump means an advisory in one of them
# is found by reading, not by a bot: the Harbor release is a benchmark harness,
# the versions in docs/benchmark.md were measured against a specific one, and
# changing it changes a number rather than a binary.
#
# The composite actions are declared as directories of their own rather than
# left to the entry for `/`. Dependabot reads `.github/workflows` for that
# entry and nothing else, so `mlugg/setup-zig` and `actions/cache`, which are
# pinned inside `.github/actions/setup-zig/action.yml` and
# `.github/actions/setup-linters/action.yml` rather than in a workflow, would
# sit at their pinned sha until a runner image stopped answering to one of
# them. The three entries share a schedule and a limit, so the repository
# receives one grouped pull request per week.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - ci
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /.github/actions/setup-zig
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - ci
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /.github/actions/setup-linters
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - ci
    groups:
      actions:
        patterns:
          - "*"
