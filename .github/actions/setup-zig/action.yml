# Installs the minimum Zig version declared as `.minimum_zig_version` in
# build.zig.zon. Every job uses this rather than repeating the extraction, so
# the version a release asset is published from is the version CI validated
# rather than whatever setup-zig happens to default to.
name: setup-zig
description: install the Zig version build.zig.zon declares as its minimum

runs:
  using: composite
  steps:
    - name: read the minimum zig version
      id: zig
      shell: bash
      run: |
        set -euo pipefail
        version="$(make --no-print-directory required-zig-version)"
        if [ -z "$version" ]; then
          echo "build.zig.zon has no .minimum_zig_version to install" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: ${{ steps.zig.outputs.version }}

    # A cold runner compiles the toolchain's own cache and std from scratch,
    # which is most of a job's wall clock, and the cross build of every
    # published target in ci.yml is the slowest job in the gate. Both caches
    # are restored here so every job that installs the toolchain gets them and
    # no workflow repeats the step. The global cache is moved under
    # RUNNER_TEMP because its default path differs per runner OS and
    # platform.
    - name: point the global cache at a known path
      shell: bash
      run: |
        set -euo pipefail
        echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-global" >> "$GITHUB_ENV"

    # Two caches rather than one, because the two directories change at
    # different rates and a single key over both re-uploads the expensive one
    # on every push.
    #
    # Every key carries `runner.arch` as well as `runner.os`, because os alone
    # is not a machine: `macos-15-intel` is X64 and `macos-14` is ARM64, and both
    # answer `runner.os` as `macOS`. Sharing one key between them makes the two
    # jobs race to save the same entry, and the cache action keeps the first
    # and drops the second, so whichever runner is second never gets a cache of
    # its own: the X64 job restores the ARM64 tree's build products and
    # recompiles the standard library from cold on every push, which is the
    # cost these caches exist to remove.
    #
    # `.zig-cache` is this tree's own build products, so its key carries the
    # Zig version and a hash of the sources: changing either starts a new
    # entry. The restore prefix falls back to the most recent cache for the
    # same toolchain and architecture, so a commit that changed a file still
    # reuses what an earlier one built for the rest of the tree rather than
    # recompiling it from nothing.
    #
    # The hashed set is every input the build reads, not only src/: build.zig
    # embeds config.example.toml into the binary, so an edit to it changes the
    # bytes of every artifact without touching a line under src/, and a key
    # that left it out would restore the previous commit's cache entry for
    # every push that changed nothing but that file. Zig's cache is
    # content-addressed, so a stale restore costs a recompile rather than a
    # wrong binary; the key is here so the restore is a hit instead.
    - name: restore the project build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .zig-cache
        key: >-
          zig-local-${{ runner.os }}-${{ runner.arch }}-${{ steps.zig.outputs.version }}-${{
          hashFiles('build.zig', 'build.zig.zon', 'src/**',
          'config.example.toml', 'integrations/harbor/microagent_agent.py') }}
        restore-keys: |
          zig-local-${{ runner.os }}-${{ runner.arch }}-${{ steps.zig.outputs.version }}-

    # The global cache is the compiled standard library, which the toolchain
    # version alone decides. Nothing in this repository is an input to it, so
    # hashing the sources into its key would give every push that touched
    # src/ a miss, a fresh save, and an upload of the whole multi-hundred-
    # megabyte directory to store a handful of entries that changed. It is by
    # far the larger of the two: ci.yml's release-assets job alone builds four
    # published targets and rebuilds each of them twice for the
    # reproducibility check. The key is the toolchain and the architecture, so
    # the entry is written once per runner image and every later push restores
    # it.
    - name: restore the zig global cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/zig-global
        key: zig-global-${{ runner.os }}-${{ runner.arch }}-${{ steps.zig.outputs.version }}
