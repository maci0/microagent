# Installs the linters `make lint` runs, in the versions lint-requirements.txt
# pins. Every job that runs the shell, Python or YAML gate uses this rather
# than repeating the install, so the linters a release is published from are
# the ones a push was gated with.
name: setup-linters
description: install the ruff and yamllint versions the gate runs, pinned by hash

runs:
  using: composite
  steps:
    # The file is installed with --require-hashes, so an artifact whose
    # sha256 is not the one written down there fails the job instead of
    # becoming the linter that decides the gate passes. The pins are ruff and
    # yamllint themselves, plus the two packages yamllint imports, so nothing
    # in the resolution is chosen at install time.
    #
    # The install goes into a venv, since the runner's python3 is marked
    # externally managed (PEP 668). Its bin directory goes on PATH for the rest
    # of the job, so the Makefile's bare `ruff` and `yamllint` are these.
    #
    # uv's cache holds the wheels, keyed on the file that names them, so a
    # push that changes no lint pin downloads nothing. The venv itself is not
    # cached: it is built in a second and caching it would put a second copy of
    # the pinned wheels in the tree beside the ones this step already verified.
    # setup-uv's cache key already carries the runner's os and arch, which
    # matters because ruff and yamllint are installed from platform-specific
    # wheels.
    - name: install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true
        cache-dependency-glob: lint-requirements.txt
        # The default prune drops downloaded wheels, which are the whole point.
        prune-cache: false

    - name: install the linters
      shell: bash
      run: |
        set -euo pipefail
        uv venv --python 3.12 "$RUNNER_TEMP/lintenv"
        echo "$RUNNER_TEMP/lintenv/bin" >> "$GITHUB_PATH"
        uv pip install --python "$RUNNER_TEMP/lintenv/bin/python" \
          --require-hashes -r lint-requirements.txt
