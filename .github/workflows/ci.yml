# Contributor gate: the same checks `make check` runs, on the Zig version
# build.zig.zon declares as its minimum, so a push that would fail here never
# gets that far. The tests also run on a macOS runner, and the four binaries
# the release publishes build on every push, so a macOS-only break
# (`/bin/sh` differences, a glibc-only call, a path that resolves differently)
# lands as a failed check rather than as a broken update asset. Three of them
# are also built for that runner's own target and run, so a shipped asset that
# cross-compiles but does not start fails on a push
# rather than at a tag. The fourth, `aarch64-linux-musl`, needs a different
# machine and is covered by the build alone. Release assets are built by
# release.yml on a version tag.
# The shell, Python and YAML linters `make check` also runs have their own job
# below.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# New runs supersede older runs for the same pull request or pushed ref.
# Push and pull_request events have separate groups: push payloads do not
# contain a pull request number, so this does not deduplicate those events.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # `release_target` is the asset release.yml publishes for this runner's
        # platform. The default build above runs the host's own build; this one
        # runs the shipped artifact itself, so a target that cross-compiles but
        # cannot start is caught here rather than by whoever downloads it.
        include:
          - os: ubuntu-24.04
            release_target: x86_64-linux-musl
          # The arm64 image, the one that starts `aarch64-macos`. This row used
          # to name `macos-14`, which GitHub has begun deprecating and removes
          # from the fleet entirely on 2026-11-02, after a stretch of scheduled
          # brownouts that fail jobs for a reason that is not a test failure.
          # `macos-15` is the supported arm64 image and starts the same asset.
          - os: macos-15
            release_target: aarch64-macos
          # The x86_64 macOS image is the only runner that starts
          # `x86_64-macos`. The arm64 image above is Apple silicon, so without
          # this row the second of the two macOS assets the release publishes
          # is cross-compiled and never run, and a Mach-O that links but does
          # not start would ship and fail on a user's machine instead of here.
          # The `macos-13` image this row used to name is retired: GitHub
          # removes an image from the runner fleet, and a matrix row naming a
          # label no runner answers to never starts, so the job is red on
          # every push with a scheduling error rather than a test failure.
          - os: macos-15-intel
            release_target: x86_64-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain version is declared once, in build.zig.zon.
      - uses: ./.github/actions/setup-zig

      - name: format is clean
        run: make fmt-check

      # `make check` runs this, and CONTRIBUTING.md asks a contributor for the
      # same entry. This workflow does not run `make check` whole, because the
      # linters it needs are installed in the lint job's own step, so without a
      # step here the rule gates a laptop and not a push, and the first person
      # to read a malformed [Unreleased] section as rendered is whoever pulls
      # the release. Awk only, so it needs nothing setup-zig installed.
      - name: the unreleased changelog entry is well formed
        run: make check-unreleased

      # `check-changelog` is asked of the version build.zig.zon declares, so
      # the 0.y bump rule is checked when a tag is cut and never again: an edit
      # that moves an `Added` or a `Security` entry into an already published
      # patch is history a consumer has read, and no tag will ever name it. This
      # asks the same rule of every released section, oldest first. Make and awk
      # only, like the step above.
      - name: every released changelog entry matches its bump
        run: make check-changelog-history

      # A bump that moves build.zig.zon and CHANGELOG.md but leaves the README
      # behind publishes a release whose install snippet still fetches the
      # previous binary, so the README is asked the same question a push asks
      # of the changelog. Grep and make only.
      - name: the readme installs the version this tree declares
        run: make check-readme

      # The man page and `--help` are two renderings of one interface, and
      # `make install` ships the page next to the binary, so a flag added to the
      # help and left out of the page packages a binary whose page documents an
      # older one. `make check` runs this and neither workflow did, so it gated
      # a laptop and not a push. The same target a version bump has to satisfy.
      - name: the man page documents the flags this build lists
        run: make check-man

      # docs/usage.md opens with a copy of the built-in `--help`, and a copy is
      # only worth having if it is the copy: a flag, an exit status or a default
      # that moves in src/main.zig leaves the page most readers open describing
      # the previous release. `make check` runs this and neither workflow did, so
      # it gated a laptop and not a push.
      - name: the usage reference quotes this build's help
        run: make check-help

      # `make test`, not the `zig build test` it runs, for the reason the lint
      # job below calls `make lint`: the recipe is the one place the command is
      # written down, and it is the only place the build gets the LC_ALL and TZ
      # this file's Makefile exports for every other recipe. Spelled here, a
      # change to either reaches a laptop and not this runner, and the compiler
      # reads the job's ambient locale and timezone instead of the pinned pair.
      - name: unit tests pass
        run: make test

      # The same tests compiled with the undefined-behavior sanitizer. An
      # out-of-bounds load, a misaligned access or an integer overflow is
      # silent in the ReleaseSmall build above and is what the published assets
      # are made of, so the suite is run instrumented as well as plain.
      - name: unit tests pass under the undefined-behavior sanitizer
        run: make test-sanitize

      # `update` is the one subcommand that names the running executable, so
      # both paths in it are worth exercising on a real filesystem. The build
      # and the two commands are `make check-binary`, the same target `make
      # check` runs and a contributor can run on its own, so this step is not a
      # second spelling of the gate.
      - name: the optimized build runs on this platform
        run: make check-binary OPT=ReleaseSmall

      - name: the release asset for this platform runs
        run: make check-asset-run TARGET=${{ matrix.release_target }}

  # The Zig sources are covered by zig fmt in the test job above. The shell,
  # Python and YAML around them are not, and a defect in bench/run.sh or the
  # Harbor adapter is a wrong benchmark rather than a failed test, so they get
  # their own gate rather than riding along unreviewed. The tool versions are
  # pinned so a new release cannot turn a green run red on its own. `make lint`
  # reads the run: steps out of the workflows in this directory as well, so the
  # shell that publishes a release is checked by the same shellcheck as the
  # scripts rather than trusted because it is written in YAML.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pinned install lives in an action rather than in this step, because
      # release.yml gates a tag with it and two copies of a hash-pinned install
      # are two places a version bump can miss one of.
      - uses: ./.github/actions/setup-linters

      # The checks themselves are `make lint`, the same list `make check` runs
      # in the same order, rather than one step per linter. A step each is a
      # second spelling of that list, and a linter added to the Makefile
      # without a step added here would gate a push locally and not on the
      # runner. release.yml already gates a tag the same way, and the failing
      # sub-target names itself.
      - name: the shell, Python and YAML linters are clean
        run: make lint

  release-assets:
    # Every target the `update` subcommand asks for, built the way release.yml
    # builds it. A target that stops compiling, or whose asset name drifts from
    # what update.zig asks for, fails here instead of at a tag.
    runs-on: ubuntu-24.04
    # The cross build of every target plus the two independent builds of each
    # that the reproducibility check below makes, and the one more of the first
    # target it makes from a second directory, so the ceiling has to cover more
    # than twice the compile work the job used to do.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig

      # The target list and the asset names come from the Makefile, the same
      # ones release.yml builds, so a rename lands in one place. The build is
      # tagged with the version build.zig.zon declares, which is the name the
      # release publishes under and the one `make checksums` looks for: the
      # sidecars and the inventory are the rest of what a release uploads, and
      # a rehearsal under the untagged names builds neither of them.
      - name: build every published target
        run: |
          set -euo pipefail
          tag="v$(make --no-print-directory version)"
          make release-assets TAG="$tag"
          ls -l dist

      # The SPDX inventory and the sha256 sidecars, the other half of what the
      # publish step hands the API, built and read back over this job's own
      # assets. Nothing else exercises either against a real dist/: `check-sbom`
      # runs the generator over stand-in assets in a temporary directory, and
      # the one step that read the real set back is release.yml's last, which
      # runs once the release is public, on a tag whose publish step refuses to
      # replace a release a consumer may already have fetched. These are the
      # same three targets release.yml runs, in the same order.
      - name: the inventory and the sidecars are the ones a release ships
        run: |
          set -euo pipefail
          make sbom
          make checksums
          make check-checksums

      # The host binary reports the version in build.zig.zon, and every
      # published target is the object format its name promises. It is
      # `make check-assets`, the same target release.yml runs over a tagged
      # build and a laptop runs over `make release-assets`, so a push that
      # would publish an asset that cross-compiles into the wrong bytes is
      # refused here rather than by a user.
      - name: the built assets are the ones a release would publish
        run: |
          set -euo pipefail
          tag="v$(make --no-print-directory version)"
          make check-assets TAG="$tag"

      # Two independent builds of the same source must be byte-identical, or a
      # released checksum describes one binary and a rebuild produces another.
      # The recipe lives in the Makefile, which owns the published target list
      # and varies the clock, the locale, the timezone, the compiler's cache and
      # the output directory between the two builds of every target, so this
      # job and release.yml run the same check over the same targets.
      - name: the release build is reproducible
        env:
          # Both scratch roots, because the toolchain cache is a few hundred
          # megabytes and REPRO_GLOBAL left at its default writes it into the
          # checkout's .scratch/ while REPRO_DIR goes to the runner's temp.
          REPRO_DIR: ${{ runner.temp }}/microagent-repro
          REPRO_GLOBAL: ${{ runner.temp }}/microagent-repro-global
        run: make check-reproducible
