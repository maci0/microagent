# Contributor gate: the same checks `make check` runs, on the Zig version
# build.zig.zon declares as its minimum, so a push that would fail here never
# gets that far. The tests also run on a macOS runner, and the four binaries
# the release publishes build on every push, so a macOS-only break
# (`/bin/sh` differences, a glibc-only call, a path that resolves differently)
# lands as a failed check rather than as a broken update asset. The two of them
# a runner here can start are also built for that runner's own target and run,
# so a shipped asset that cross-compiles but does not start fails on a push
# rather than at a tag. The other two need a different machine and are covered
# by the build alone. Release assets are built by release.yml on a version tag.
# The shell, Python and YAML linters `make check` also runs have their own job
# below.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # `release_target` is the asset release.yml publishes for this runner's
        # platform. The default build above runs the host's own build; this one
        # runs the shipped artifact itself, so a target that cross-compiles but
        # cannot start is caught here rather than by whoever downloads it.
        include:
          - os: ubuntu-24.04
            release_target: x86_64-linux-musl
          - os: macos-14
            release_target: aarch64-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain version is declared once, in build.zig.zon.
      - uses: ./.github/actions/setup-zig

      - name: format is clean
        run: zig fmt --check src build.zig

      - name: unit tests pass
        run: zig build test --summary all

      - name: optimized build
        run: zig build -Doptimize=ReleaseSmall

      # `update` is the one subcommand that names the running executable, so
      # both paths in it are worth exercising on a real filesystem.
      - name: the built binary runs on this platform
        run: |
          set -euo pipefail
          ./zig-out/bin/microagent --version
          ./zig-out/bin/microagent update --help >/dev/null

      - name: the release asset for this platform runs
        run: |
          set -euo pipefail
          zig build -Dtarget=${{ matrix.release_target }} -Doptimize=ReleaseSmall
          ./zig-out/bin/microagent --version
          ./zig-out/bin/microagent update --help >/dev/null

  # The Zig sources are covered by zig fmt in the test job above. The shell,
  # Python and YAML around them are not, and a defect in bench/run.sh or the
  # Harbor adapter is a wrong benchmark rather than a failed test, so they get
  # their own gate rather than riding along unreviewed. The tool versions are
  # pinned so a new release cannot turn a green run red on its own.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install the linters
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            ruff==0.16.4 yamllint==1.38.0

      - name: the shell scripts parse and are shellcheck-clean
        run: make lint-shell

      - name: the Harbor adapter is ruff-clean and ruff-formatted
        run: make lint-python

      - name: the workflows and the shared toolchain action are yamllint-clean
        run: make lint-yaml

  release-assets:
    # Every target the `update` subcommand asks for, built the way release.yml
    # builds it. A target that stops compiling, or whose asset name drifts from
    # what update.zig asks for, fails here instead of at a tag.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-zig

      # The target list and the asset names come from the Makefile, the same
      # ones release.yml builds, so a rename lands in one place.
      - name: build every published target
        run: |
          set -euo pipefail
          make release-assets
          ls -l dist

      - name: the host binary reports the version in build.zig.zon
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*\.version = "\([^"]*\)".*/\1/p' build.zig.zon)"
          got="$(./dist/microagent-x86_64-linux-musl --version)"
          test "$got" = "microagent $version"

      # Two independent builds of the same source must be byte-identical, or a
      # released checksum describes one binary and a rebuild produces another.
      # Separate cache and output directories force a real second build rather
      # than a cache hit, and the clock, timezone and locale are varied so a
      # timestamp or locale ordering leaking into the binary fails here.
      - name: the release build is reproducible
        run: |
          set -euo pipefail
          build_once() {
            SOURCE_DATE_EPOCH="$1" LC_ALL="$2" TZ="$3" zig build \
              -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSmall \
              --cache-dir "$4" -p "$5"
            sha256sum "$5/bin/microagent" | cut -d' ' -f1
          }
          first=$(build_once 1700000000 C UTC "$RUNNER_TEMP/cache-a" "$RUNNER_TEMP/out-a")
          second=$(build_once 1800000000 C.UTF-8 Asia/Tokyo "$RUNNER_TEMP/cache-b" "$RUNNER_TEMP/out-b")
          if [ "$first" != "$second" ]; then
            echo "rebuild differs: $first != $second" >&2
            exit 1
          fi
          echo "both builds produce $first"
