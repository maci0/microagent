# Release pipeline: on a v* tag, build the four cross-compiled binaries the
# `update` subcommand looks for, checksum each one, and publish them as a
# GitHub release. The job only runs when the tag names the version in
# build.zig.zon, so an asset can never be published under a version the binary
# does not report, and it only runs when CHANGELOG.md has an entry for that
# version, so the release notes a consumer reads are the ones written for them
# rather than a list of commit subjects. A tag push matches no branch filter,
# so ci.yml has not run on this tree: the job repeats the gate itself.
#
# Zig cross-compiles every target here, so one Linux runner builds the macOS
# binaries too; nothing links libc, so no target needs its own runner.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain version is declared once, in build.zig.zon.
      - uses: ./.github/actions/setup-zig

      - name: tag names the build.zig.zon version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*\.version = "\([^"]*\)".*/\1/p' build.zig.zon)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not name build.zig.zon version v${version}" >&2
            exit 1
          fi

      # A tag push does not match ci.yml's branch filter, so nothing else has
      # run the gate on this tree by the time these assets are published.
      - name: format is clean
        run: zig fmt --check src build.zig

      - name: unit tests pass
        run: zig build test --summary all

      # The target list and the asset names come from the Makefile, so a
      # rehearsal with `make release-assets TAG=v0.2.0` builds the same files
      # this step publishes.
      - name: build and checksum the release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          make release-assets
          make checksums
          # The host-arch asset must be the binary this tag names.
          got="$("./dist/microagent-${GITHUB_REF_NAME}-x86_64-linux-musl" --version)"
          test "$got" = "microagent ${GITHUB_REF_NAME#v}"
          ls -l dist

      - name: the changelog has an entry for this tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v want="$version" '
            index($0, "## [" want "]") == 1 { inside = 1; next }
            /^## / { inside = 0 }
            inside
          ' CHANGELOG.md > release-notes.md
          sed -i '/./,$!d' release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no [${version}] entry, so there are no consumer-facing notes to publish" >&2
            exit 1
          fi
          cat release-notes.md

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; refusing to replace it" >&2
            exit 1
          fi
          # The changelog section is the release note, so a consumer reads what
          # changed for them instead of a list of commit subjects.
          gh release create "${GITHUB_REF_NAME}" --verify-tag --draft \
            --title "microagent ${GITHUB_REF_NAME}" --notes-file release-notes.md \
            dist/microagent-*
          gh release edit "${GITHUB_REF_NAME}" --draft=false
