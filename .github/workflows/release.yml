# Release pipeline: on a v* tag, build the four cross-compiled binaries the
# `update` subcommand looks for, checksum each one, and publish them as a
# GitHub release. The job only runs when the tag names the version in
# build.zig.zon, so an asset can never be published under a version the binary
# does not report, and it only runs when CHANGELOG.md has an entry for that
# version, so the release notes a consumer reads are the ones written for them
# rather than a list of commit subjects. A tag push matches no branch filter,
# so ci.yml has not run on this tree: the job repeats the gate itself.
#
# Zig cross-compiles every target here, so one Linux runner builds the macOS
# binaries too; nothing links libc, so no target needs its own runner.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # The cross build of every published target, the two independent builds of
    # each that the reproducibility check makes, and the gate itself, so the
    # ceiling has to cover more than the compile work it used to do.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain version is declared once, in build.zig.zon.
      - uses: ./.github/actions/setup-zig

      # The same action the push gate installs its linters with, so a tag is
      # published under the same ruff and yamllint a push was refused by.
      - uses: ./.github/actions/setup-linters

      # What the tag has to satisfy before anything is built: it names the
      # version build.zig.zon declares, nothing is left stranded under
      # [Unreleased] for the tag to drop, and the section it names is one the
      # 0.y policy allows. The checks are `make check-release`, the same
      # targets a laptop runs with `make check-release TAG=v0.2.0` before the
      # tag exists, so the release note is written against a command rather
      # than against a workflow nobody can run until they have pushed a tag.
      - name: the tag names the version, and the changelog satisfies it
        run: make check-release TAG="$GITHUB_REF_NAME"

      # A tag push does not match ci.yml's branch filter, so nothing else has
      # run the gate on this tree by the time these assets are published. The
      # whole of it, not the part of it this job used to repeat: the tag can
      # name a commit no push has run since the last change to a shell script,
      # the Harbor adapter or a workflow, and a release cut without that gate
      # is how one of them reaches a consumer unreviewed.
      - name: every published target is one `update` asks for
        run: make check-targets

      - name: format is clean
        run: make fmt-check

      - name: the shell, Python and YAML linters are clean
        run: make lint

      - name: unit tests pass
        run: zig build test --summary all

      - name: unit tests pass under the undefined-behavior sanitizer
        run: zig build test-sanitize --summary all

      # The target list and the asset names come from the Makefile, so a
      # rehearsal with `make release-assets TAG=v0.2.0` builds the same files
      # this step publishes.
      - name: build and checksum the release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          make release-assets
          make checksums
          # The host asset is run and every published target is read back for
          # the object format its name promises, off disk rather than from the
          # build that wrote it. It is `make check-assets`, the same target a
          # laptop runs after `make release-assets TAG=v0.2.0`, so a rehearsal
          # of this release checks what the tag will check.
          make check-assets
          ls -l dist

      # A tag push matches no branch filter in ci.yml, so the release-assets
      # job's byte-identical rebuild has not run on this commit unless a push
      # happened to cover it. It is the same Makefile target that job runs, so
      # a release is never published from a commit whose assets a rebuild would
      # not reproduce.
      - name: the release build is reproducible
        env:
          REPRO_DIR: ${{ runner.temp }}/microagent-repro
        run: make check-reproducible

      # The section this tag publishes, read out of CHANGELOG.md by
      # `make check-changelog`, the same target the pre-publish gate ran one
      # step earlier. It prints the notes and nothing else, so the file the
      # publish step reads is the section the check just accepted rather than
      # a second awk over the same file that can disagree with it.
      - name: the changelog entry this tag publishes
        run: |
          set -euo pipefail
          make --no-print-directory check-changelog VERSION="${GITHUB_REF_NAME#v}" > release-notes.md
          cat release-notes.md

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The release is created as a draft and published one step later, so a
          # run that died in between leaves a release the next run finds. A
          # draft was never public: finishing it is what the run was for, and
          # the assets are rebuilt byte-identical, so the rerun converges on the
          # same published release. A published one is refused, because a
          # consumer has it and replacing it is not this workflow's call.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "release ${GITHUB_REF_NAME} is already published; refusing to replace it" >&2
              exit 1
            fi
            echo "release ${GITHUB_REF_NAME} is a draft an earlier run left behind; finishing it"
            gh release upload "${GITHUB_REF_NAME}" dist/microagent-* --clobber
            gh release edit "${GITHUB_REF_NAME}" --draft=false
            exit 0
          fi
          # The changelog section is the release note, so a consumer reads what
          # changed for them instead of a list of commit subjects.
          gh release create "${GITHUB_REF_NAME}" --verify-tag --draft \
            --title "microagent ${GITHUB_REF_NAME}" --notes-file release-notes.md \
            dist/microagent-*
          gh release edit "${GITHUB_REF_NAME}" --draft=false

      # Publishing hands a glob to the API and reports success, which says the
      # call was accepted rather than that the release carries what a consumer
      # will ask it for. An asset the upload silently skipped, an asset from a
      # previous tag still attached to the draft, or a sidecar naming bytes other
      # than the asset beside it, all publish green and fail on the machine that
      # runs `update`. So this reads the release back through the same API a
      # consumer's `update` uses and compares it with dist/: the same asset
      # names, every one byte-identical to the build, every sidecar naming the
      # digest of the asset it sits beside.
      - name: the published release is the one this tag built
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "release ${GITHUB_REF_NAME} is still a draft after publish" >&2
            exit 1
          fi
          published="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort)"
          built="$(cd dist && ls microagent-* | sort)"
          if [ "$published" != "$built" ]; then
            echo "the published release and this tag's build disagree on the asset list" >&2
            echo "published: $(echo "$published" | tr '\n' ' ')" >&2
            echo "built: $(echo "$built" | tr '\n' ' ')" >&2
            exit 1
          fi
          # An empty dist/ is a build that produced nothing, and an empty
          # published list would compare equal to it.
          test -n "$built" || { echo "dist/ holds no assets, so there is nothing to have published" >&2; exit 1; }
          verify="${RUNNER_TEMP}/published"
          rm -rf "$verify" && mkdir -p "$verify"
          for asset in $built; do
            gh release download "${GITHUB_REF_NAME}" --pattern "$asset" --dir "$verify"
            if ! cmp "dist/$asset" "$verify/$asset"; then
              echo "the published $asset is not the one this run built" >&2
              exit 1
            fi
          done
          for target in $(make --no-print-directory release-targets); do
            name="microagent-${GITHUB_REF_NAME}-${target}"
            got="$(sha256sum "$verify/$name" | cut -d' ' -f1)"
            want="$(cut -d' ' -f1 < "dist/$name.sha256")"
            if [ "$got" != "$want" ]; then
              echo "$name.sha256 names $want; the published $name is $got" >&2
              exit 1
            fi
          done
          echo "published release ${GITHUB_REF_NAME} carries $(echo "$built" | wc -l) assets, each byte-identical to dist/ and matching its sidecar"
