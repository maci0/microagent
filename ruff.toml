# The Python in integrations/harbor is small but real: it drives the benchmark
# adapter, so a typo in it silently reports the wrong reward. `make check` runs
# `ruff check` and `ruff format --check` against these files, and CI runs the
# same commands.
line-length = 120

# The Python the adapter runs on, not the one ruff assumes. Left unset, ruff
# falls back to py39 and every UP rule that only fires from 3.10 on is never
# evaluated: the tree is checked against a Python it does not support and
# passes there, which says nothing about the one it does. 3.12 is the floor
# integrations/harbor/requirements.txt records, in the `uv pip compile
# --python-version 3.12` that generates the lock the adapter is installed from.
target-version = "py312"

lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific correctness
    "PIE",  # misc lints
    "RET",  # return statements
    "PL",   # pylint
    "ARG",  # unused arguments
    "PTH",  # pathlib
    "TID",  # tidy imports
    "S",    # bandit, security defects
    "N",    # pep8-naming
    "A",    # shadowed builtins
    "ANN",  # annotations on every signature, so a new one is checked
    "BLE",  # blind except
    "C90",  # mccabe complexity, capped below
    "DTZ",  # naive datetime calls
    "EXE",  # shebang and executable rules
    "FBT",  # a boolean argument reads at the call site as a plain flag
    "FLY",  # string formatting: an f-string with nothing in it, a join of literals
    "G",    # logging format
    "ISC",  # implicit string concatenation
    "ICN",  # import conventions
    "LOG",  # logging misuse
    "PERF", # per-loop performance
    "PGH",  # blanket noqa and type ignores
    "Q",    # quote style
    "RSE",  # unnecessary parens on raise
    "SLF",  # private member access
    "SLOT", # __slots__ on subclasses
    "T10",  # leftover debugger calls
    "TC",   # a third-party import used only in an annotation, which costs import time

    "TRY",  # tryceratops: a swallowed raise, a useless finally, a bare return in except
    "ASYNC", # async correctness: blocking a loop, a stray task group
    "ERA",   # commented-out code, which is never deleted and always misread
    "FA",    # `__future__` imports, so an annotation cannot be a runtime error
    "FIX",   # modernizations pyupgrade's UP does not cover
    "FURB",  # ruff's own rewrites of the same code
    "TD",    # a TODO or FIXME in a comment, which the tree carries none of
    "YTT",   # sys.version and py.version branches, every one of them wrong now
]

lint.ignore = [
    # A literal compared against len(sys.argv) reads as the arity it checks;
    # naming it would only move the number somewhere else.
    "PLR2004",
    # TRY003 wants the message moved into an exception class. Here the message
    # is the whole diagnostic: it names the missing binary, the env var to set
    # and the build command to run, and an operator reads it in a harbor trace,
    # not a traceback that ends in a class name they then have to look up.
    # The rest of TRY (TRY002, TRY200/TRY201, TRY300, TRY301, TRY400, TRY401)
    # is on and is what catches a swallowed raise or a useless finally.
    "TRY003",
]

# The caps the size rules measure against, written down rather than left at
# ruff's defaults so a bump is a line someone edited on purpose. Branches are
# held to the same 10 as mccabe below, because the two measure the same thing
# from two directions: a function C901 passes can still be one PLR0912 refuses.
lint.pylint.max-branches = 10
lint.pylint.max-returns = 6
lint.pylint.max-statements = 50

# The cap C901 measures against, written down rather than left at ruff's
# default so a bump is a line someone edited on purpose.
[lint.mccabe]
max-complexity = 10
