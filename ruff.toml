# The Python in integrations/harbor is small but real: it drives the benchmark
# adapter, so a typo in it silently reports the wrong reward. `make check` runs
# `ruff check` and `ruff format --check` against these files, and CI runs the
# same commands.
line-length = 120

# The Python the adapter runs on, not the one ruff assumes. Left unset, ruff
# falls back to py39 and every UP rule that only fires from 3.10 on is never
# evaluated: the tree is checked against a Python it does not support and
# passes there, which says nothing about the one it does. 3.12 is the floor
# integrations/harbor/requirements.txt records, in the `uv pip compile
# --python-version 3.12` that generates the lock the adapter is installed from.
target-version = "py312"

lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific correctness
    "PIE",  # misc lints
    "RET",  # return statements
    "PL",   # pylint
    "ARG",  # unused arguments
    "PTH",  # pathlib
    "TID",  # tidy imports
    "S",    # bandit, security defects
    "N",    # pep8-naming
    "A",    # shadowed builtins
    "ANN",  # annotations on every signature, so a new one is checked
    "BLE",  # blind except
    "C90",  # mccabe complexity, capped below
    "DTZ",  # naive datetime calls
    "EXE",  # shebang and executable rules
    "FBT",  # a boolean argument reads at the call site as a plain flag
    "G",    # logging format
    "ISC",  # implicit string concatenation
    "ICN",  # import conventions
    "LOG",  # logging misuse
    "PERF", # per-loop performance
    "PGH",  # blanket noqa and type ignores
    "Q",    # quote style
    "RSE",  # unnecessary parens on raise
    "SLF",  # private member access
    "SLOT", # __slots__ on subclasses
    "T10",  # leftover debugger calls
    "ASYNC", # async correctness: blocking a loop, a stray task group
    "ERA",   # commented-out code, which is never deleted and always misread
    "FA",    # `__future__` imports, so an annotation cannot be a runtime error
    "FIX",   # modernizations pyupgrade's UP does not cover
    "FURB",  # ruff's own rewrites of the same code
]

lint.ignore = [
    # A literal compared against len(sys.argv) reads as the arity it checks;
    # naming it would only move the number somewhere else.
    "PLR2004",
]

# The cap C901 measures against, written down rather than left at ruff's
# default so a bump is a line someone edited on purpose.
[lint.mccabe]
max-complexity = 10
